<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Canva</h1>
<h2>ID: <span th:text="${drawingID}"></span> </h2>


<p hidden>drawing Data print: <span th:text="${JSON_test_print}" id="JsonString"></span></p>

<canvas id="canvas" width="800" height="600" style="border: 2px solid black;"></canvas>

</canvas>
<div id="controls" style="border: 2px solid black;">
    <select id="shapeOption">
        <option value="square">Square</option>
        <option value="circle">Circle</option>
        <option value="triangle">Triangle</option>
        <option value="star">Star</option>
    </select>
    <input type="range" min="1" max="100" value="10" id="sizeOfShape">
    <input type="color" value="#ff0000" id="color">
    <input type="checkbox" id="isFilledToggle">
    <input type="checkbox" id="IsFreeDrawMode">
    <input type="range" min="1" max="100" value="10" id="strokeValue">

</div>


<div>
    <form method="POST" th:action="@{/studio/canvas/save}">
        <input type="hidden" name="jsonData" id="meuInputOcult">
        <input type="hidden" name="drawingID" th:value="${drawingID}">

        <input type="submit" id="sendBoard">
    </form>

</div>

<!--<button id="hiddenInput">Envia</button>-->


<ul id="Board">

</ul>
<script type="module" src="/script.js"></script>
<script type="module" src="/modules.js"></script>
</body>
</html>
