<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

<div>
    <h1>Canva</h1>
    <h2 class="mb-3">ID: <span th:text="${drawingID}"></span></h2>

    <p hidden>drawing Data print: <span th:text="${JSON_test_print}" id="JsonString"></span></p>

    <canvas id="canvas" width="800" height="600" style="border: 2px solid #6c757d; max-width: 100%; background-color: aliceblue"></canvas>

    <div id="controls" class="bg-secondary p-3 mt-3 rounded d-flex flex-wrap gap-3 align-items-center">
        <select class="form-select w-auto" id="shapeOption">
            <option value="square">Square</option>
            <option value="circle">Circle</option>
            <option value="triangle">Triangle</option>
            <option value="star">Star</option>
        </select>

        <input class="form-range w-auto" type="range" min="1" max="100" value="10" id="sizeOfShape">
        <input type="color" value="#ff0000" id="color">
        <input type="checkbox" id="isFilledToggle">
        <input type="checkbox" id="IsFreeDrawMode">
        <input class="form-range w-auto" type="range" min="1" max="100" value="10" id="strokeValue">
    </div>

    <div class="mt-3">
        <form method="POST" th:action="@{/studio/canvas/save}">
            <input type="hidden" name="jsonData" id="meuInputOcult">
            <input type="hidden" name="drawingID" th:value="${drawingID}">
            <input class="btn btn-primary" type="submit" id="sendBoard" value="Save Drawing">
        </form>
    </div>

    <ul id="Board" class="mt-3"></ul>
</div>

<script type="module" src="/script.js"></script>
<script type="module" src="/modules.js"></script>
<script type="module" src="/navigation.js"></script>

</body>
</html>
