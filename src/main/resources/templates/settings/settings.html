<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Drawing Settings</title>
</head>
<body>
    <h1>Drawing Settings</h1>
    <h2 th:text="'Drawing name: ' + ${drawing.getName()}"></h2>
    <h3 th:text="'Drawing id: ' + ${drawing.drawing_id}"></h3>

    <div id="info">
        <p th:text="'Drawing Deleted status: ' + ${drawing.getDeleted_at()}" th:if="${drawing.getDeleted_at() != null}"></p>
        <p th:unless="${drawing.deleted_at != null}">Not deleted</p>
        <p th:text="'Drawing Owners User ID: ' + ${drawing.getUser_id()}"></p>
        <p th:text="'created At: ' + ${drawing.getCreation_date()}"></p>
    </div>

    <div id="sharedList">
        <h2>Users with Permissions</h2>
        <form method="post" th:action="@{/settings/addpermission}">
            <label for="userSearch">Make user have Permission</label>
            <input type="text" id="userSearch" name="username">
            <input type="hidden" th:value="${drawing.drawing_id}" name="drawingId">

            <label for="Write">Can Edit</label>
            <input type="radio" id="Write" name="permission" value="true" required>

            <label for="Read">Can View</label>
            <input type="radio" id="Read" name="permission" value="false">

            <input type="submit">
        </form>
        <p id="Error" th:text="${error}" th:if="${error}"></p>

        <ul>
            <li th:each="shared : ${sharedUsers}">
                <p th:text="${shared.user?.username} + ' - ' + ${shared.permission.permission_type}"></p>
                <form method="post" th:action="@{/settings/revoke}">
                    <input type="hidden" name="drawingId" th:value="${drawing.drawing_id}">
                    <input type="hidden" name="userId" th:value="${shared.user.id}">

                    <input type="submit" value="Revoke">
                </form>


            </li>
        </ul>
    </div>
</body>
</html>
