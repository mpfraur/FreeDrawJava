<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5" style="max-width: 400px;">
    <h1 class="mb-4">Login Page</h1>

    <form th:action="@{/login}" method="post">
        <input class="form-control mb-3 bg-dark text-light" type="text" name="username" placeholder="Username" required>

        <input class="form-control mb-3 bg-dark text-light" type="password" name="password" placeholder="Password" required>

        <p class="text-danger" th:text="${message}"></p>

        <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <a href="/register">Dont have an account? → Register</a>
</div>

</body>
</html>
