<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h1>Welcome Home!</h1>
    <a class="btn btn-outline-danger mt-2" href="/logout">Logout</a>

    <h3 class="mt-4">Drawings</h3>

    <h2 class="mt-4">Create New Drawing</h2>
    <form method="POST" action="/home" class="mb-4">
        <input class="form-control bg-dark text-light mb-3" type="text" id="name" name="drawingName" placeholder="Drawing name">
        <input class="btn btn-primary" type="submit" value="Create">
    </form>

    <ul class="list-group">
        <li class="list-group-item bg-dark text-light d-flex justify-content-between align-items-center"
            th:each="drawing : ${drawingsList}">

            <span th:text="${drawing.name}"></span>

            <div class="d-flex gap-2">
                <form method="POST" th:action="@{/home/delete}">
                    <input type="hidden" name="drawingID" th:value="${drawing.ID}">
                    <input class="btn btn-danger btn-sm" type="submit" value="Delete">
                </form>

                <form method="GET" th:action="@{/studio/canva/{id}(id=${drawing.ID})}">
                    <input class="btn btn-primary btn-sm" type="submit" value="Edit">
                </form>
            </div>
        </li>
    </ul>
</div>

<script type="module" src="/navigation.js"></script>

</body>
</html>
