<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
<h1>Welcome Home!</h1>
<a href="/logout">Logout</a>

<h3>Drawings</h3>
<h2>Create new Drawing</h2>
<form method="POST" action="/home">
    <p>Name:</p>
    <input type="text" id="name" name="drawingName">
    <input type="submit">
</form>
<ul>
    <li th:each="drawing : ${drawingsList}">
        <span th:text="${drawing.name}"></span>

        <form method="POST" th:action="@{/home/delete}">
            <input type="hidden" name="drawingID" th:value="${drawing.ID}">
            <input type="submit" value="Delete">
        </form>

        <form method="GET" th:action="@{/studio/canva/{id}(id=${drawing.ID})}">
            <input type="submit" value="Edit">
        </form>
    </li>
</ul>


</body>
</html>
