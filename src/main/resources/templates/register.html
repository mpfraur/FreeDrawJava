<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5" style="max-width: 400px;">
    <h1 class="mb-4">Register Forum</h1>

    <form th:action="@{/register}" method="post">
        <input class="form-control mb-3 bg-dark text-light" type="text" name="username" placeholder="Username" required>

        <input class="form-control mb-3 bg-dark text-light" type="password" name="password" placeholder="Password" required>

        <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>

    <div class="text-success mt-3" th:text="${message}"></div>
    <div class="text-danger mt-2" th:text="${warning}"></div>
    <a href="/login">Already have account? → Login</a>

</div>

</body>
</html>
