<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Galleries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h1 class="mb-4">Other People's Drawings</h1>

    <ul class="list-group">
        <li class="list-group-item bg-dark text-light border-secondary mb-2 rounded"
            th:each="drawing : ${drawingsList}">

            <p th:text="'ID: ' + ${drawing.ID}"></p>
            <p th:text="'Name: ' + ${drawing.name}"></p>
            <p th:text="'User: ' + ${drawing.user}"></p>
            <p th:text="'Draws: ' + ${drawing.amountOFDraws}"></p>

            <form method="get" th:action="@{/galleries/canvaview/{id}(id=${drawing.ID})}">
                <input class="btn btn-primary btn-sm" type="submit" value="View">
            </form>
        </li>
    </ul>
</div>

<script type="module" src="/navigation.js"></script>

</body>
</html>
