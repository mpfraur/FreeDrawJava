services:
  mysql:
    image: mysql:8.4
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./mysqlData:/var/lib/mysql
      - ../src/main/resources/db/tables.sql:/docker-entrypoint-initdb.d/tables.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8083:80"
  environment:
    PMA_HOST: mysql
    UPLOAD_LIMIT: 300M